name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: logdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci_owner_pw
      POSTGRES_USER: postgres
      POSTGRES_DB: logdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Initialise database (same scripts the container runs)
        run: |
          psql -v ON_ERROR_STOP=1 -U postgres -d logdb -f db/01_schema.sql
          APP_DB_PASSWORD=ci_app_pw bash db/02_app_role.sh
      - name: Unit + integration tests
        env:
          DATABASE_URL: postgresql://log_app:ci_app_pw@localhost:5432/logdb
          DATABASE_ADMIN_URL: postgresql://postgres:ci_owner_pw@localhost:5432/logdb
        run: pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
